# Installed by ops/provision (§17). Ubuntu's postgresql-18, sized for the 4 GB CX23.
shared_buffers = 256MB
# TCP on loopback only; pg_hba.conf allows no TCP logins. App roles use the unix socket.
listen_addresses = 'localhost'
# pg_create_restore_point before each deploy's migrations needs WAL at replica level (the default).
wal_level = replica
